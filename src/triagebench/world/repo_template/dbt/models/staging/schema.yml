version: 2

models:
  - name: stg_loans
    description: Loans as originated, one row per loan.
    columns:
      - name: loan_id
        data_tests: [unique, not_null]
      - name: branch_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_branch')
                field: branch_code
              config:
                severity: warn
      - name: product_code
        data_tests:
          - accepted_values:
              arguments:
                values: ["MORT30", "MORT15", "HELOC", "AUTO60", "PERS36"]
  - name: stg_payments
    description: Current state of each payment after CDC deduplication.
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: loan_id
        data_tests: [not_null]
  - name: stg_bureau
    columns:
      - name: borrower_id
        data_tests: [not_null]
